<!DOCTYPE html>
<html>
<head>
    <title>Redirecting to TestFlight...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        // Thử mở TestFlight ngay lập tức
        window.location.href = "testflight://install?app_id=123456";
        
        // Fallback sau 0.5 giây nếu không mở được TestFlight
        setTimeout(function() {
            window.location.href = "https://apps.apple.com/us/app/idYOUR_APP_STORE_ID";
        }, 500);
    </script>
    <style>
        body { 
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f5f5f7;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #007aff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Đang chuyển hướng đến TestFlight...</h2>
    <p>Nếu không tự động chuyển, <a href="testflight://install?app_id=123456">nhấn vào đây</a>.</p>
</body>
</html>
